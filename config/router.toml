# Model routing and budget config. No secrets in this file:
# the Anthropic key comes from the ANTHROPIC_API_KEY environment variable.

[budget]
monthly_usd = 75.0       # hard cap on all frontier spend in a calendar month
daily_usd = 10.0         # hard cap per calendar day
per_target_usd = 12.0    # hard cap per target snapshot (all stages combined)

# Local LLM on llm-server. The pipeline only relies on this contract:
# an OpenAI-compatible /v1/chat/completions endpoint plus the aliases below.
# Whoever runs llm-server can change the serving stack (Ollama, vLLM, ...)
# as long as the contract holds.
[local]
base_url = "http://llm-server:11434/v1"
timeout_s = 600
concurrency = 1          # Ollama on llm-server currently serves one request at a time
# qwen3.8 is a reasoning model: its thinking counts against max_tokens and arrives in a
# separate `reasoning` field. "low" keeps it short; "none" turns it off. Part of the
# llm-server contract: the server must accept (or ignore) this OpenAI-style field.
reasoning_effort = "low"

[local.aliases]
# Keep both aliases on one model unless the backtest says otherwise. Ollama
# swaps models in and out of VRAM, so alternating two 27-31B models would thrash.
local-triage = "qwen3.8:27b-128k"
local-summarize = "qwen3.8:27b-128k"

# Hosted OpenAI-compatible APIs, used by routes written "<name>:<model>". Keys come from the
# environment (cron loads ~/.bashrc_env); they are never stored here or logged.
[providers.mistral]
base_url = "https://api.mistral.ai/v1"
key_env = "MISTRAL_API_KEY"
timeout_s = 300            # llm-council found large prompts can exceed 120 s

# Stage D (deep analysis) knobs.
[analysis]
enabled = false           # stage D spends API money; `bounty run` skips it until this is true.
                          # Use `bounty analyze <name>` for a controlled manual run first.
top_n = 5                  # hotspots analyzed per target
max_iterations = 3         # PoC write -> sandbox -> feedback rounds per hotspot
max_tokens = 12000         # per model reply (reasoning models think first)
escalate = false           # NOT BUILT YET: retry high-confidence misses on deep_analysis_escalation (Opus)

# Stage F2 (skeptic review) knobs. Opus tries to refute each stage-D finding.
[review]
enabled = false           # spends API money; `bounty run` skips it until this is true.
                          # Use `bounty review <finding id>` for a controlled manual run first.
mode = "batch"            # batch: 50% off, collected by the next run | sync: answer in this run
effort = "high"           # Opus 5.5 always thinks; effort sets the depth (its default is medium)
max_tokens = 16000        # thinking counts against this

# Execution sandbox for untrusted target code (SPEC.md §4.1).
[sandbox]
image = "bounty-sandbox:latest"
cpus = 2.0
memory = "4g"
pids_limit = 512
timeout_s = 900

# Stage -> model routes. "local:<alias>" runs on llm-server; anything else is a Claude model ID.
[routes]
policy_parse = "local:local-triage"
triage = "local:local-triage"
summarize = "local:local-summarize"
dedup = "local:local-triage"
deep_analysis = "mistral:deepseek-v4-1-flash-1017"   # cheap first pass (~15x cheaper than Opus)
deep_analysis_escalation = "claude-opus-5-5"         # only for high-confidence misses, if [analysis] escalate
skeptic_review = "claude-opus-5-5"
report_draft = "claude-sonnet-5-5"
overflow = "claude-haiku-5-5"   # used for local-lane stages when the queue is backed up
