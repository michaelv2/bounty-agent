[project]
name = "bounty-agent"
version = "0.0.1"
description = "Offline-first agentic pipeline for source-available bug bounty targets"
readme = "README.md"
requires-python = ">=3.11"
# Constraints come from the dependency security audit (2026-11-21).
# Install exactly `anthropic`. A malicious look-alike, `anthropic-sdk`, exists.
dependencies = [
    "anthropic>=2.6,<3",
    "httpx2>=2.16,<3",   # used by the anthropic SDK; we use it for the local LLM client too
    "typer>=0.23",
]

[dependency-groups]
dev = ["pytest>=9.0,<10"]

[project.scripts]
bounty = "bounty_agent.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bounty_agent"]

[tool.uv]
# Only resolve releases at least ~2 weeks old (supply-chain cooling-off period).
# Move this date forward deliberately, with a fresh dependency audit.
exclude-newer = "2026-11-07T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs Docker and the bounty-sandbox image (skipped otherwise)"]
